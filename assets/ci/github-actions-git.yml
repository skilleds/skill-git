# Gate de histórico do git, no CI REMOTO — só onde o piso 27 permite.
# O gate por commit/push é LOCAL (hooks `pre-commit`/`pre-push` + `check-git.sh`). Este workflow NÃO roda
# por commit nem por PR (custo): roda (a) uma vez antes de promover a hml (tag `hml-*`), (b) em release
# (tag `v*`) e (c) sob pedido (`workflow_dispatch`). Não existe "check obrigatório no PR".
name: check-git
on:
  workflow_dispatch:
  push:
    tags: ["hml-*", "v*"]
    paths-ignore: ["**.md", "docs/**", "*_archive/**"]
concurrency:
  group: check-git-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gate do fluxo git (commits desde a promoção anterior)
        run: |
          set -euo pipefail
          # Copie scripts/check-git.sh da skill schematize-git para .github/scripts/ do repo.
          # Range = desde a tag anterior (hml-* ou v*); sem tag anterior, tudo. Não há base de PR.
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          RANGE="${PREV:+${PREV}..}${GITHUB_SHA}"
          # --require-signed só depois de montar o allowed_signers (references/assinatura.md).
          bash .github/scripts/check-git.sh . --range "${RANGE}" --linear
